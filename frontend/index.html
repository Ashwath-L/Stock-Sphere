<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockSphere - Login</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom Styling -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-brand-icon">
      <i class="fas fa-cubes"></i>
    </div>
    
    <div class="login-header">
      <h2>StockSphere</h2>
      <p>Inventory Management System</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="form-control-icon">
          <i class="fas fa-user"></i>
          <input type="text" id="username" class="form-control" placeholder="Enter username" required autocomplete="username">
        </div>
      </div>

      <div class="form-group" style="margin-top: 15px; margin-bottom: 25px;">
        <label for="password">Password</label>
        <div class="form-control-icon">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%;">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
    </form>
  </div>

  <!-- Central Client JS -->
  <script src="js/script.js"></script>
</body>
</html>
